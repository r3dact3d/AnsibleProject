---
- name: Playbook to authenticate to one platform and export the resources
  hosts: localhost
  ignore_errors: true
  vars:
    aap_username: "{{ (lookup('env', 'CONTROLLER_USERNAME')) }}"
    aap_password: "{{ (lookup('env', 'CONTROLLER_PASSWORD')) }}"
    aap_hostname: "{{ (lookup('env', 'CONTROLLER_HOST')) }}"
    aap_validate_certs: "{{ (lookup('env', 'CONTROLLER_VERIFY_SSL')) | default(false) }}"
    controller_validate_certs: false
    controller_oauthtoken: "{{ (lookup('env', 'CONTROLLER_OAUTH_TOKEN')) }}"
    flatten_output: True

  pre_tasks:
    - name: "Setup authentication (block)"
      block:
        - name: "Get the Authentication Token for the future requests"
          ansible.builtin.uri:
            url: "https://{{ aap_hostname }}/api/gateway/v1/tokens/"
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ aap_validate_certs }}"
            status_code: 201
          register: authtoken_res

        - name: "Set the oauth token to be used since now"
          ansible.builtin.set_fact:
            aap_oauthtoken: "{{ authtoken_res.json.token }}"
            aap_oauthtoken_url: "{{ authtoken_res.json.url }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging | default('false') }}"
      when: aap_oauthtoken is not defined
      tags:
        - always

  roles:
    - infra.aap_configuration_extended.filetree_create

  post_tasks:

    - name: Get matching files
      ansible.builtin.find:
        path: "/tmp/filetree_output"
      register: matched_files

    - name: Print matched_files variable
      ansible.builtin.debug:
        var: matched_files

    - name: Set fact from matched files
      ansible.builtin.set_fact:
        filetree_output_fact: "{{ matched_files.files | map(attribute='path') }}"

    - name: Print filetree_output_fact var 
      ansible.builtin.debug:
        var: filetree_output_fact

    - name: Slurp all YAML files
      ansible.builtin.slurp:
        src: "{{ item }}" # 'item' will be each file path from the loop
      loop: "{{ filetree_output_fact }}"
      register: slurped_files_results
      loop_control:
        label: "{{ item }}" 

    - name: DEBUG - Show decoded content of each file BEFORE parsing
      ansible.builtin.debug:
        msg: "File: {{ item.item }}\n--- Decoded YAML Content ---\n{{ item.content | b64decode }}\n--- END Decoded YAML Content ---"
      loop: "{{ slurped_files_results.results }}"
      when: item.content is defined and item.content != ""
      loop_control:
        label: "{{ item.item }}"

    - name: Initialize workflow artifact dictionary
      ansible.builtin.set_fact:
        my_workflow_artifact: {}

    # Loop through the slurped files and add their content to the artifact dictionary
    - name: Populate artifact with decoded content from each file
      ansible.builtin.set_fact:
        # Combine the existing dictionary with a new entry.
        # The key is the basename of the file (e.g., 'controller_inventories').
        # The value is the raw decoded content.
        my_workflow_artifact: "{{ my_workflow_artifact | combine({ item.item | basename | regex_replace('\\.yaml$', '') : decoded_content }) }}"
      loop: "{{ slurped_files_results.results }}"
      when: item.content is defined and item.content != ""
      vars:
        # This is the raw string content after Base64 decoding
        decoded_content: "{{ item.content | b64decode }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Display the created artifact (for debugging)
      ansible.builtin.debug:
        var: my_workflow_artifact
      when: my_workflow_artifact is defined

    # To explicitly set this as an artifact for AAP/AWX workflows using set_stats:
    - name: Set data as workflow artifact using set_stats
      ansible.builtin.set_stats:
        data:
          # This will make the entire 'my_workflow_artifact' dictionary available
          # under a key, for example, 'processed_file_data'.
          # Or you can pass my_workflow_artifact directly if your consuming job expects that structure.
          processed_file_data: "{{ my_workflow_artifact }}"
      when: my_workflow_artifact is defined and my_workflow_artifact | length > 0

    - name: Display parsed content of each file individually
      ansible.builtin.set_stats:
        data: 
          filetree_output_stat: "{{ item.content | b64decode }}"
      loop: "{{ slurped_files_results.results }}"
      when: item.content is defined and item.content != ""
      loop_control:
        label: "{{ item.item }}"

    - name: "Delete the Authentication Token used"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ aap_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: aap_oauthtoken_url is defined

...