---
- name: Interact with LLM for AAP Resource YAML Analysis
  hosts: localhost
  gather_facts: false
  vars:
    ollama_api_url: "{{ lookup('env', 'OLLAMA_API_URL') }}"
    ollama_api_token: "{{ lookup('env', 'OLLAMA_API_TOKEN') }}"
    ollama_api_model: 'granite3.1-moe:3b'
  tasks:
    - name: Print the artifacts
      loop:
        - filetree_output_stat
        - filetree_output_orig
      ansible.builtin.debug:
        var: "{{ item }}"

    - name: Show the difference in yaml format
      register: diff_result
      ansible.utils.fact_diff:
        before: "{{ filetree_output_orig | to_nice_yaml }}"
        after: "{{ filetree_output_stat | to_nice_yaml }}"

    - name: Print diff result
      ansible.builtin.debug:
        msg: "{{ diff_result.stdout }}"

    - name: Prepare the prompt for the LLM
      ansible.builtin.set_fact:
        llm_prompt: |
          You are an AI assistant specialized in Ansible Automation Platform, jinja, yaml, and python.  
          Your purpose is to compare the difference in Ansible Automation Platform resource configuration.

          Original configuration
          ```yaml
          {{ filetree_output_orig | to_nice_yaml }}
          ```

          newly exported configuration
          ```yaml
          {{ filetree_output_stat | to_nice_yaml }}
          ```

          Differences in configuraion
          ```yaml
          {{ diff_result.stdout }}
          ```

          Please perform the following tasks:
          1. Prepared for you is the Original configurations and the newly exported configuration along with the difference already extracted.
          2. Explain the differences in configs and other important information
          3. Explain the possible reasons for the configuration change
          4. Recommend actions

    - name: Display the prepared prompt (for debugging)
      ansible.builtin.debug:
        var: llm_prompt
      when: true

    - name: Print api response
      ansible.builtin.debug:
        msg: "{{ api_response.json }}"
