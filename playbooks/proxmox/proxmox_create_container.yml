---
- name: Playbook to get info on Proxmox nodes
  hosts: localhost
  tasks:
    - name: Print the stat artifact
      ansible.builtin.debug:
        var: proxmox_nodes_artifact

    - name: Create new container with minimal options
      register: new_container
      community.general.proxmox:
        node: "{{ proxmox_nodes_artifact.proxmox_nodes[0].node }}"
        api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
        api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') | default(omit) }}"
        api_host: "{{ lookup('env', 'PROXMOX_IP') }}"
        password: "{{ host_password }}"
        hostname: "{{ ct_hostname }}"
        ostemplate: "local:vztmpl/{{ ct_ostemplate }}"
        disk: 'local-lvm:20'
        netif:
          net0: "name=eth0,ip=dhcp,ip6=dhcp,bridge=vmbr0"
        features:
          - nesting=1
        cores: 1
        tags: automated
        onboot: true

    - name: Print container details
      ansible.builtin.debug:
        var: new_container

    - name: Start container
      community.general.proxmox:
        vmid: "{{ new_container.vmid }}"
        api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
        api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') | default(omit) }}"
        api_host: "{{ lookup('env', 'PROXMOX_IP') }}"
        state: started
        
    - name: Export new_container variable as artifact
      ansible.builtin.set_stats:
        data:
          proxmox_new_container_artifact: "{{ new_container }}"