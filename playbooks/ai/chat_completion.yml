---
- name: Ask LLM a Question
  hosts: localhost
  gather_facts: false
  collections:
    - redhat.ai 
  vars:
    OLLAMA_TOKEN: "{{ (lookup('env', 'MY_TOKEN')) }}"
    OLLAMA_URL: "{{ (lookup('env', 'BASE_URL')) }}"
    OLLAMA_MODEL: "{{ (lookup('env', 'MODEL_PATH')) }}"
  tasks:
    - name: Ask model a question
      redhat.ai.completion:
        base_url: "{{ OLLAMA_URL }}"
        token: "{{ OLLAMA_TOKEN }}"
        model_path: "{{ OLLAMA_MODEL }}"
        prompt: "\n\n### Instructions:\nCapital of India?\n\n### Response:\n"
        validate_certs: false
#        model_path: /var/home/ec2-user/.cache/instructlab/models/granite-8b-starter-v1
      delegate_to: localhost