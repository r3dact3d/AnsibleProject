---
- name: Gather Host Information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Prompt for host1 IP
      vars_prompt:
        - name: host1_ip
          prompt: Enter the IP address of host1:
    - name: Prompt for host2 IP
      vars_prompt:
        - name: host2_ip
          prompt: Enter the IP address of host2:
    - name: Prompt for host1 controller username
      vars_prompt:
        - name: host1_controller_username
          prompt: Enter the controller username for host1:
    - name: Prompt for host1 controller password
      vars_prompt:
        - name: host1_controller_password
          prompt: Enter the controller password for host1:
    - name: Prompt for host2 controller username
      vars_prompt:
        - name: host2_controller_username
          prompt: Enter the controller username for host2:
    - name: Prompt for host2 controller password
      vars_prompt:
        - name: host2_controller_password
          prompt: Enter the controller password for host2:

- name: Export from host1 and Import to host2
  hosts: "{{ host1_ip }}"
  gather_facts: false
  vars:
    host1_ip: "{{ host1_ip }}"
    host2_ip: "{{ host2_ip }}"
    host1_controller_username: "{{ host1_controller_username }}"
    host1_controller_password: "{{ host1_controller_password }}"
    host2_controller_username: "{{ host2_controller_username }}"
    host2_controller_password: "{{ host2_controller_password }}"
  collections:
    - ansible.controller
  tasks:
    - name: Export all tower assets on host1
      ansible.controller.export:
        all: True
        validate_certs: false
        controller_host: "https://10.168.128.102"
        controller_username: "{{ host1_controller_username }}"
        controller_password: "{{ host1_controller_password }}"
      register: export_output
      ignore_errors: yes  # Handle potential export failures gracefully

    - name: Get hostname and timestamp
      set_fact:
        host1_hostname: "{{ ansible_hostname }}"
        datetime_stamp: "{{ lookup('pipe', 'date +\"%Y%m%d_%H%M%S\"') }}"

    - name: Set the export file path on host1
      set_fact:
        host1_export_path: "/var/lib/awx/projects/backup/{{ host1_hostname }}_{{ datetime_stamp }}.json"

    - name: Ensure backup directory exists on both hosts
      file:
        path: /var/lib/awx/projects/backup
        state: directory
        mode: '0755'
      delegate_to: "{{ item }}"
      with_items:
        - "{{ host1_ip }}"
        - "{{ host2_ip }}"

    - name: Write export output to file on host1
      copy:
        content: "{{ export_output }}"
        dest: "{{ host1_export_path }}"
        mode: '0644'
        force: no

    - name: Copy backup file to host2
      synchronize:
        src: "{{ host1_export_path }}"
        dest: "/var/lib/awx/projects/backup/"
        delete: yes
        delegate_to: "{{ host2_ip }}"

    - name: Import assets on host2
      delegate_to: "{{ host2_ip }}"
      ansible.controller.import:
        src: "{{ host1_export_path | basename }}"
        validate_certs: false
        controller_host: "https://10.168.128.102"
        controller_username: "{{ host2_controller_username }}"
        controller_password: "{{ host2_controller_password }}"
      ignore_errors: yes  # Handle potential import failures gracefully
