---
- name: Check Blinker19 Pi-Hole Admin
  hosts: localhost
  sources:
    - ansible.eda.url_check:
      delay: 30
      verify_ssl: false
      urls:
        - http://192.168.1.180/admin

  rules:
    - name: Print event
      condition: event.url_check.status
      action:
        print_event:
          pretty: true

