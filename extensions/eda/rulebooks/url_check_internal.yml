---
- name: Blinker19 Internal Services
  hosts: localhost
  sources:
    - ansible.eda.url_check:
        name: internal_services
        delay: 300
        verify_ssl: false
        urls:
          - https://0ri0n.blinker19.com # Ollama/OpenWeb Ui
          - http://192.168.1.87:8123/lovelace/0 # Home Assistant
  rules:
    - name: Internal Service DOWN - Notify and Restart
      condition: event.url_check.status == "down"
      actions:
        - debug:
            msg: "Placeholder for notification: Internal service DOWN: {{ event.url_check.url }}."

    - name: Internal Service Recovery Notification
      condition: event.url_check.status == "up" and event.previous_status == "down"
      action:
        print_event:
          msg: "INTERNAL SERVICE RECOVERED: {{ event.url_check.url }} is UP!"
          pretty: true