---
- name: Check Blinker19 Services and Debug URL Events
  hosts: localhost
  sources:
    - ansible.eda.url_check:
        name: critical_services
        delay: 30 # How often to check in seconds
        verify_ssl: false
        urls:
          - http://192.168.1.180/admin
          - https://192.168.1.232:8006

  rules:
    - name: Critical Service DOWN - Notify and Restart
      condition: event.url_check.status == "down" and event.url_check.url in ["http://192.168.1.180/admin", "https://192.168.1.232:8006"]
      actions:
        - debug:
            msg: "Placeholder for notification: Critical service DOWN: {{ event.url_check.url }}."
        - run_job_template:
            name: "Restart Proxmox Container"
            organization: "Blinker19"
            job_args:
              extra_vars:
                IP_ADDRESS: "{{ '192.168.1.232' }}"

    - name: Critical Service Recovery Notification
      condition: event.url_check.status == "up" and event.previous_status == "down"
      action:
        print_event:
          msg: "CRITICAL SERVICE RECOVERED: {{ event.url_check.url }} is UP!"
          pretty: true
