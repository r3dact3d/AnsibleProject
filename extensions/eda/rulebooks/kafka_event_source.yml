---
- name: Blinker19 Kafka Events
  hosts: localhost
  sources:
    - ansible.eda.kafka:
        name: Kafka Event Source
        host: home-assistant.hole
        port: 1883
        topic: meshtastic/pynode/#

  rules:
    - name: kafka
      condition: event.message is defined
      action:
        print_events:
          msg: "{{ event.message }}"
          pretty: true
