---
- name: Blinker19 Kafka Events
  hosts: localhost
  sources:
    - ansible.eda.kafka:
        name: Kafka Event Source
        host: "192.168.1.177"
        port: "9092"
        check_hostname: false
        verify_mode: "CERT_OPTIONAL"
        topic: "homeassistant1"
        group_id: ansible-eda

  rules:
    - name: kafka
      condition: event.body.message != ""
      action:
        debug:
          msg: "{{ event.body.message }}"
