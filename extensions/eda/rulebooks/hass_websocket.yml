---
- name: home assistant websocket presence
  hosts: localhost
  sources:
    - runejuhl.unusual_ansible.hass_websocket:
        name: Home Assistant Websocket
        uri: "{{ HASS_WEBSOCKET_URI }}"
        access_token: "{{ HASS_ACCESS_TOKEN }}"
        event_types:
          - state_changed

  rules:
    - name: Motion Sensor State Changed
      condition:
        all:
          - event.payload is defined
          - event.payload.event.event_type == "state_changed"
          - event.payload.event.data.entity_id is regex('^binary_sensor\..+?_motion$')
          - event.payload.event.data.new_state.state in ['on', 'off']

      action:
        run_workflow_template:
          name: "Home Assistant Response Workflow WT"
          organization: Blinker19
